{% extends "base.html" %}

{% block title %}Удаление статуса — Менеджер задач{% endblock %}

{% block content %}
  <h1 class="mb-6 text-3xl font-semibold text-gray-950">Удаление статуса</h1>
  <p class="mb-6 text-lg">Вы уверены, что хотите удалить {{ object.name }}?</p>
  <form method="post">
    {% csrf_token %}
    <button class="rounded bg-red-600 px-4 py-2 font-medium text-white hover:bg-red-700" type="submit">Да, удалить</button>
  </form>
{% endblock %}
