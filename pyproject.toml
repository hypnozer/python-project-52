[project]
authors = [
    {name = "Hexlet team", email = "team@hexlet.io"},
]
requires-python = "<4.0,>=3.12"
name = "hexlet-code"
version = "0.1.0"
description = "Task management web application"
readme = "README.md"
dependencies = [
    "dj-database-url>=3.0.1,<4.0",
    "django>=5.2,<6.0",
    "django-filter>=26.1,<27.0",
    "django-tailwind-cli>=2.22.1,<3.0",
    "gunicorn>=23.0.0,<24.0",
    "psycopg2-binary>=2.9.10,<3.0",
    "python-dotenv>=1.1.0,<2.0",
    "whitenoise>=6.9.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.11.1",
    "ruff>=0.7.1",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "task_manager.settings"

[tool.coverage.run]
omit = [
    "manage.py",
    "task_manager/asgi.py",
    "task_manager/settings.py",
    "task_manager/wsgi.py",
]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task_manager"]
