[project]
authors = [
    {name = "Hexlet team", email = "team@hexlet.io"},
]
requires-python = "<4.0,>=3.12"
name = "hexlet-code"
version = "0.1.0"
description = "Task management web application"
readme = "README.md"
dependencies = [
    "dj-database-url>=3.1.2,<4.0",
    "django>=6.1,<7.0",
    "django-filter>=26.1,<27.0",
    "django-tailwind-cli>=4.7.0,<5.0",
    "gunicorn>=26.1.0,<27.0",
    "psycopg2-binary>=2.9.12,<3.0",
    "python-dotenv>=1.2.3,<2.0",
    "sentry-sdk[django]>=2.68.0,<3.0",
    "whitenoise>=6.12.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "task_manager.settings"

[tool.coverage.run]
omit = [
    "manage.py",
    "task_manager/asgi.py",
    "task_manager/settings.py",
    "task_manager/wsgi.py",
]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task_manager"]
